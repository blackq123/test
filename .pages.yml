media:
  input: media
  output: /media

content:
  - name: posts
    label: Posts
    type: collection
    path: content/posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
      - name: draft
        label: Draft
        type: boolean
        default: true
      - name: description
        label: Description
        type: text
      - name: image
        label: Cover image
        type: image
      - name: body
        label: Body
        type: rich-text

  - name: settings
    label: Site settings
    type: file
    path: content/settings.json
    fields:
      - name: title
        label: Site title
        type: string
      - name: description
        label: Site description
        type: text
